    <!-- Static structured data for crawlers (React Helmet adds per-route data too) -->

        "@type": "WebSite",
        "name": "OA Solutions",
        "url": "https://oasolutions.dev",
        "description": "Custom software development, web application development, CRM development and business process automation for Ontario and Canada.",
