<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OA Solutions — Technology, Automation & Digital Solutions</title>
    <meta
      name="description"
      content="OA Solutions builds websites, custom applications, automation, and AI tools for businesses across industries. Your technology partner for growth."
    />
    <link rel="canonical" href="https://oasolutions.com/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="OA Solutions | Technology, Automation & Digital Solutions" />
    <meta
      property="og:description"
      content="Custom websites, applications, automation, and AI tools for restaurants, retail, construction, freelancers, and more."
    />
    <meta property="og:image" content="https://oasolutions.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://oasolutions.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OA Solutions" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OA Solutions | Technology, Automation & Digital Solutions" />
    <meta
      name="twitter:description"
      content="Custom websites, applications, automation, and AI tools for businesses across industries."
    />
    <meta name="twitter:image" content="https://oasolutions.com/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "OA Solutions",
        "description": "Custom websites, applications, automation, and AI tools for businesses across industries.",
        "url": "https://oasolutions.com",
        "email": "contact@oasolutions.dev",
        "telephone": "+1-647-854-3079",
        "image": "https://oasolutions.com/og-image.png",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Ontario, Canada"
        },
        "priceRange": "$$"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How much does a restaurant website cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most projects land in a scoped range after discovery. We quote fixed scope — not open-ended hourly surprises — so you know what you are paying for before we build."
            }
          },
          {
            "@type": "Question",
            "name": "Can you connect to our POS or existing tools?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, when APIs allow. We map your POS, reservations, payments, and delivery stack in discovery and only promise integrations we can deliver."
            }
          },
          {
            "@type": "Question",
            "name": "How long until we launch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Typical marketing sites: 3–5 weeks. Reservations or AI phone systems take longer depending on workflows, training data, and third-party connections."
            }
          },
          {
            "@type": "Question",
            "name": "Who owns the code and content?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You do. We deliver source, domains, and credentials at handoff. No hostage hosting or lock-in contracts."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
